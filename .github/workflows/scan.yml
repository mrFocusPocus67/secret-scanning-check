name: Secret Scanning (Gitleaks + TruffleHog) - 20 Projects

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target_repo: [
          "adeyosemanputra/pygoat",
          "we45/Vulnerable-Flask-App",
          "mattvaldes/vulnerable-api",
          "OWASP/DjanGoat",
          "snyk/goof",
          "0019-KDU/vulnerable-web-app",
          "EyalSec/vulnerable-javascript",
          "vulnerable-apps/vulnerable-react-app",
          "SasanLabs/VulnerableApp",
          "vulnerable-apps/vulnado",
          "jerryhoff/WebGoat.NET",
          "vulnerable-apps/ticketmagpie",
          "interference-security/DVWS",
          "vulnerable-apps/xvwa",
          "vulnerable-apps/websheep",
          "vulnerable-apps/Vulnerable-OTP-Application",
          "OWASP/railsgoat",
          "vulnerable-apps/vuln-graphql-ruby",
          "dolevf/Damn-Vulnerable-GraphQL-Application",
          "vulnerable-apps/vapi"
        ]

    steps:
      - name: Checkout целевого проекта
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target_repo }}
          path: target
          fetch-depth: 0

      - name: Установка Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Запуск Gitleaks
        run: |
          gitleaks detect --source ./target \
            --report-format json \
            --report-path gitleaks-results.json \
            --no-banner || true

      - name: Установка TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Запуск TruffleHog
        run: |
          # --no-verification: не проверяем найденные ключи на живых сервисах
          trufflehog git file://$PWD/target \
            --json --no-update --no-verification \
            > trufflehog-results.json || true

      - name: Сводка по результатам (Секреты) в консоль
        run: |
          # Получаем имя проекта без слешей для красивого вывода
          REPO_NAME=$(echo "${{ matrix.target_repo }}" | tr '/' '_')
          
          echo "РЕЗУЛЬТАТЫ ДЛЯ ПРОЕКТА: ${{ matrix.target_repo }}"
          # Считаем Gitleaks (количество элементов в JSON массиве)
          if [ -f gitleaks-results.json ]; then
            G_COUNT=$(jq '. | length' gitleaks-results.json)
          else
            G_COUNT=0
          fi
          
          # Считаем TruffleHog (количество строк в JSON, так как это построчный вывод)
          if [ -f trufflehog-results.json ]; then
            T_COUNT=$(wc -l < trufflehog-results.json)
          else
            T_COUNT=0
          fi
          
          echo "Gitleaks:   $G_COUNT находок"
          echo "TruffleHog: $T_COUNT находок"
        continue-on-error: true

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ strategy.job-index }}-${{ matrix.target_repo == 'snyk/goof' && 'goof' || 'project' }}
          path: |
            gitleaks-results.json
            trufflehog-results.json
          if-no-files-found: warn
