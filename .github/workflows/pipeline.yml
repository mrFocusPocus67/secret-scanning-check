name: Последовательный пайплайн безопасности (SCA -> SAST -> Secrets)

on:
  workflow_dispatch:

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: [1/3] SCA: Установка OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: [1/3] SCA: Запуск OSV-Scanner
        run: |
          echo "::group::Детальный лог сканирования зависимостей"
          osv-scanner --lockfile=package-lock.json || true
          echo "::endgroup::"
          echo "Анализ зависимостей завершен."

      - name: [2/3] SAST: Установка Semgrep
        run: pip install semgrep

      - name: [2/3] SAST: Запуск Semgrep
        run: |
          echo "::group::Детальный лог статического анализа"
          semgrep scan --config auto || true
          echo "::endgroup::"
          echo "Статический анализ кода завершен."

      - name: [3/3] Secrets: Установка Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: [3/3] Secrets: Запуск Gitleaks и TruffleHog
        run: |
          echo "::group::Детальный лог поиска секретов"
          gitleaks detect --source . --no-banner || true
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
          trufflehog git file://$PWD --no-update --no-verification || true
          echo "::endgroup::"
          echo "Поиск секретов завершен."

      - name: Финальный отчет пайплайна
        run: |
          echo "## Пайплайн безопасности успешно завершен!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Этап | Инструменты | Статус |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA (Зависимости) | OSV-Scanner | Успешно |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Исходный код) | Semgrep | Успешно |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets (Утечки) | Gitleaks, TruffleHog | Успешно |" >> $GITHUB_STEP_SUMMARY
          echo "Все этапы пройдены. Перейдите во вкладку Summary."
