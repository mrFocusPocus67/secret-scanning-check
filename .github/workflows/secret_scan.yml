name: Secret Scanning - Single Project

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Имя папки приложения (например, Juice_Shop)'
        required: true
      repo_url:
        description: 'URL репозитория (например, https://github.com/juice-shop/juice-shop.git)'
        required: true

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          REPO_URL="${{ github.event.inputs.repo_url }}"
          
          APP_DIR="applications/$APP_NAME"
          mkdir -p "$APP_DIR/gitleaks" "$APP_DIR/trufflehog"

          rm -rf target_app
          
          if ! git clone --depth 1 "$REPO_URL" target_app; then
            echo "ОШИБКА: Не удалось клонировать $REPO_URL"
            exit 1
          fi

          gitleaks detect --source target_app --report-format json --report-path "$APP_DIR/gitleaks/results.json" --no-banner || true
          
          trufflehog git file://$PWD/target_app --json --no-update > "$APP_DIR/trufflehog/results.json" || true

          rm -rf target_app

      - name: Commit and Push Results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/
          git commit -m "Results for ${{ github.event.inputs.app_name }}" || echo "No changes to commit"
          git push
