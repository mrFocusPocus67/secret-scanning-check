name: Secret Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GIT_TERMINAL_PROMPT: "0"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          url=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.assets[] | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url')
          curl -sSfL "$url" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan repositories
        run: |
          projects=(
            "Juice_Shop:https://github.com/juice-shop/juice-shop.git"
            "WebGoat:https://github.com/WebGoat/WebGoat.git"
            "PyGoat:https://github.com/adeyosemanputra/pygoat.git"
            "Vuln-bookstore:https://github.com/tobiasbruss/vulnerable-repo.git"
            "DVNA:https://github.com/appsecco/dvna.git"
            "NodeGoat:https://github.com/OWASP/NodeGoat.git"
            "Vulnerable-Flask-App:https://github.com/we45/Vulnerable-Flask-App.git"
            "DjanGoat:https://github.com/OWASP/DjanGoat.git"
            "goof:https://github.com/snyk/goof.git"
            "vulnerable-web-app:https://github.com/0019-KDU/vulnerable-web-app.git"
            "WebGoat.NET:https://github.com/jerryhoff/WebGoat.NET.git"
            "xvwa:https://github.com/siberas/xvwa.git"
            "railsgoat:https://github.com/OWASP/railsgoat.git"
            "Damn-Vulnerable-GraphQL-Application:https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git"
            "Vulnerable-OTP-Application:https://github.com/vulnerable-apps/Vulnerable-OTP-Application.git"
            "Vulnerable-App-multirepo-dependant:https://github.com/Security-Phoenix-demo/Vulnerable-App-multirepo-dependant.git"
            "vulnerable-go-app:https://github.com/ryanmcmorrowsnyk/vulnerable-go-app.git"
            "vuln-spring-sast-practice:https://github.com/jo-0412/vuln-spring-sast-practice.git"
            "mcp-security-workshop:https://github.com/antoninBr/mcp-security-workshop.git"
            "capstone-test-website-spring:https://github.com/vurs/capstone-test-website-spring.git"
            "Node.js-Vulnerable:https://github.com/ivrubtsov/Node.js-Vulnerable.git"
            "example-java-springboot3.2:https://github.com/cvemula1/example-java-springboot3.2.git"
            "vulnerable-node-api:https://github.com/Dishan-Chalana/vulnerable-node-api.git"
            "gitleaks-recipes:https://github.com/williampsena/gitleaks-recipes.git"
            "gitleaks-playground:https://github.com/stephane-klein/gitleaks-playground.git"
            "trufflesecurity_test_keys:https://github.com/trufflesecurity/test_keys.git"
            "haxcms-nodejs:https://github.com/haxtheweb/haxcms-nodejs.git"
            "homer-app:https://github.com/sipcapture/homer-app.git"
            "Hospital-Management-System:https://github.com/code-projects/Hospital-Management-System.git"
            "vulnerable-javascript:https://github.com/EyalSec/vulnerable-javascript.git"
          )
          mkdir -p work applications
          for entry in "${projects[@]}"; do
            name="${entry%%:*}"
            url="${entry#*:}"
            if ! git clone --quiet "$url" "work/$name"; then
              echo "ОШИБКА: Не удалось клонировать $url. Пропускаем."
              continue
            fi
            out="applications/$name"
            mkdir -p "$out/gitleaks" "$out/trufflehog"
            
            # Gitleaks с флагом --redact, чтобы скрыть сами секреты в отчете
            gitleaks detect --source "work/$name" --report-format json --report-path "$out/gitleaks/results.json" --redact --no-banner --exit-code 0 || true
            
            # TruffleHog
            trufflehog git "file://$PWD/work/$name" --json --no-update --no-verification > "$out/trufflehog/raw.jsonl" || true
            
            # ЖЕСТКАЯ ОЧИСТКА: Оставляем только File, Commit и RuleID, а вместо секрета пишем REDACTED
            jq -R -c 'fromjson? | {File: .SourceMetadata.Data.Git.file, Commit: .SourceMetadata.Data.Git.commit, RuleID: .DetectorName, Secret: "REDACTED"}' "$out/trufflehog/raw.jsonl" > "$out/trufflehog/results.json" || true
            
            rm -f "$out/trufflehog/raw.jsonl"
            rm -rf "work/$name"
          done

      - name: Disable push protection
        if: ${{ env.ADMIN_TOKEN != '' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          GH_TOKEN="$ADMIN_TOKEN" gh api -X PATCH "repos/${{ github.repository }}" -f 'security_and_analysis[secret_scanning_push_protection][status]=disabled' || true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add secret scan results"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Enable push protection
        if: ${{ always() && env.ADMIN_TOKEN != '' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          GH_TOKEN="$ADMIN_TOKEN" gh api -X PATCH "repos/${{ github.repository }}" -f 'security_and_analysis[secret_scanning_push_protection][status]=enabled' || true
