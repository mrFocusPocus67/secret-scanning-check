name: Secret Scanning Benchmark

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Имя папки приложения (например, Juice_Shop)'
        required: true
      repo_url:
        description: 'URL уязвимого репозитория'
        required: true

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Clone Target App
        run: |
          mkdir -p target_app
          git clone --depth 1 ${{ github.event.inputs.repo_url }} target_app

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Scanners and Save to Folders
        run: |
          APP_DIR="applications/${{ github.event.inputs.app_name }}"
          mkdir -p "$APP_DIR/gitleaks" "$APP_DIR/trufflehog"
          
          echo "Запуск Gitleaks..."
          gitleaks detect --source target_app --report-format json --report-path "$APP_DIR/gitleaks/results.json" --no-banner || true
          
          echo "Запуск TruffleHog..."
          # TruffleHog выдает JSONL (построчно), поэтому перенаправляем вывод в файл
          trufflehog git file://$PWD/target_app --json --no-update > "$APP_DIR/trufflehog/results.json" || true

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/
          git commit -m "Results for ${{ github.event.inputs.app_name }} (Gitleaks + TruffleHog)" || echo "No changes to commit"
          git push
