name: Последовательный пайплайн безопасности (SCA -> SAST -> Secrets)

on:
  workflow_dispatch:

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: '[1/3] SCA: Установка OSV-Scanner'
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: '[1/3] SCA: Запуск OSV-Scanner'
        run: |
          echo -e "\033[96m>>> Анализ зависимостей (SCA) запущен...\033[0m"
          osv-scanner --lockfile=package-lock.json || true
          echo -e "\033[96m>>> SCA завершен.\033[0m"

      - name: '[2/3] SAST: Установка Semgrep'
        run: pip install semgrep

      - name: '[2/3] SAST: Запуск Semgrep'
        run: |
          echo -e "\033[93m>>> Статический анализ кода (SAST) запущен...\033[0m"
          semgrep scan --config auto || true
          echo -e "\033[93m>>> SAST завершен.\033[0m"

      - name: '[3/3] Secrets: Установка Gitleaks'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: '[3/3] Secrets: Запуск Gitleaks и TruffleHog'
        run: |
          echo -e "\033[91m>>> Поиск секретов (Secret Scanning) запущен...\033[0m"
          gitleaks detect --source . --no-banner || true
          
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
          trufflehog git file://$PWD --no-update --no-verification || true
          echo -e "\033[91m>>> Secret Scanning завершен.\033[0m"

      - name: 'Пайплайн успешно завершен'
        run: |
          echo -e "   \033[96m SCA:     Проверка зависимостей [OK]\033[0m"
          echo -e "   \033[93m SAST:    Анализ исходного кода  [OK]\033[0m"
          echo -e "   \033[91m Secrets: Поиск утечек ключей   [OK]\033[0m"
